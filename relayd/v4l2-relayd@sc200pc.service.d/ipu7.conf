# Installed by `install.sh --ipu7`: run icamerasrc from the Intel camera HAL
# under /opt/ipu7-camera. The unit's device policy already allows the IPU7
# PSYS node (char-psys), media, video4linux and DRM.
[Service]
Environment=GST_PLUGIN_PATH=/opt/ipu7-camera/lib/gstreamer-1.0
Environment=LD_LIBRARY_PATH=/opt/ipu7-camera/lib
