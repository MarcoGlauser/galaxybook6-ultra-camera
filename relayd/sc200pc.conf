# v4l2-relayd instance feeding the SC200PC through the IPU7 hardware ISP
# (Intel camera HAL + icamerasrc, installed under /opt/ipu7-camera by
# install.sh) into a v4l2loopback device. Zoom opens the device
# directly; browsers get it through PipeWire.
#
# v4l2-relayd keeps the camera closed until a client starts streaming from
# the loopback device, and closes it again when the last one stops.
#
# AE may stretch the frame down to 24 fps in dim light (fps-range) and keeps
# the sensor's analogue gain at or below 11x (gain-range, in dB); caps stay
# 30 fps for clients.

VIDEOSRC="icamerasrc device-name=sc200pc-uf fps-range=24~30 gain-range=0~21 ! video/x-raw,format=NV12,width=1280,height=720,framerate=30/1 ! videoconvert"

FORMAT=YUY2
WIDTH=1280
HEIGHT=720
FRAMERATE=30/1

# Must match card_label in /etc/modprobe.d/v4l2-relayd.conf, from the
# v4l2-relayd package. (A second options file cannot rename it: the
# package's card_label wins.)
CARD_LABEL="Virtual Camera"
