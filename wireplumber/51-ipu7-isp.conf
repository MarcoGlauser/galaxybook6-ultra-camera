# The camera reaches applications as the v4l2loopback device that
# v4l2-relayd feeds from icamerasrc. WirePlumber's V4L2 monitor offers that
# device to PipeWire clients. Its other camera monitor is turned off so
# browsers do not also see the raw sensor as a second camera that would
# compete with the relay for it.

wireplumber.profiles = {
  main = {
    monitor.libcamera = disabled
  }
}
